[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-data-normalizer"
version = "0.1.0"
description = "Clean and unify messy MLS-style, county assessor and spreadsheet comps exports into one schema named after the public RESO Data Dictionary."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chase Builds" }]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pyarrow>=15"]

[project.scripts]
listnorm = "listing_data_normalizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["listing_data_normalizer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"benchmark/run_benchmark.py" = ["E501"]
"docs/build_demo.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["listing_data_normalizer", "benchmark"]

[tool.mypy]
python_version = "3.11"
files = ["src", "benchmark"]
strict = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pyarrow.*"]
ignore_missing_imports = true
